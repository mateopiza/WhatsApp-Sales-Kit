<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{display:flex;gap:8px;padding:16px;height:128px;font-family:var(--font-body);background:var(--bg-page)}</style></head><body><div style="flex:1;background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fg-primary)">bg-surface</div>
   <div style="flex:1;background:var(--bg-surface-muted);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fg-primary)">bg-surface-muted</div>
   <div style="flex:1;background:var(--bg-inverse);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fg-on-inverse)">bg-inverse</div>
   <div style="flex:1;background:var(--bg-accent);border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--fg-on-accent)">bg-accent</div></body></html>
