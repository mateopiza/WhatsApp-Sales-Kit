version: "3.9"

# ─────────────────────────────────────────────────────────────
# Empires Jewelry — Single Store Docker Compose
#
# Usage:
#   docker compose up -d
#   docker compose --env-file .env.mi-tienda up -d
#
# Override any value with an .env file or -e flags:
#   STORE_NAME=Perla Negra STORE_WHATSAPP_PHONE=+52551234567 docker compose up -d
# ─────────────────────────────────────────────────────────────

services:
  store:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: empires-jewelry-store:latest
    container_name: ${COMPOSE_PROJECT_NAME:-empires}-store
    restart: unless-stopped
    ports:
      - "${STORE_PORT:-3000}:80"
    environment:
      STORE_NAME: ${STORE_NAME:-Empires Jewelry}
      STORE_CURRENCY: ${STORE_CURRENCY:-USD}
      STORE_WHATSAPP_PHONE: ${STORE_WHATSAPP_PHONE:-+1234567890}
      STORE_PRIMARY_COLOR: ${STORE_PRIMARY_COLOR:-#D4B48C}
      STORE_ACCENT_COLOR: ${STORE_ACCENT_COLOR:-#3A332D}
      STORE_ADMIN_PIN: ${STORE_ADMIN_PIN:-1879}
      STORE_LOGO_URL: ${STORE_LOGO_URL:-}
      STORE_TAGLINE: ${STORE_TAGLINE:-Joyería de Alta Distinción}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Persist product data (SQLite / JSON fallback)
      - store_data:/app/data
    networks:
      - store_net

  # ─── MCP Orchestrator Server (whatsapp-emprendedor-tool) ───
  mcp-server:
    build:
      context: ../../../whatsapp-emprendedor-tool/mcp-server
      dockerfile: Dockerfile
    image: empires-mcp-server:latest
    container_name: ${COMPOSE_PROJECT_NAME:-empires}-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-3001}:3001"
    environment:
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      DOCKER_HOST_BASE_URL: ${DOCKER_HOST_BASE_URL:-http://store:80}
      STORE_API_URL: http://store:80/api
      STORE_ADMIN_PIN: ${STORE_ADMIN_PIN:-1879}
      NODE_ENV: production
    # Allow Docker socket access to manage containers (only if deploying multi-store)
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      store:
        condition: service_healthy
    networks:
      - store_net

networks:
  store_net:
    driver: bridge

volumes:
  store_data:
    driver: local
