version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# WhatsApp Sales Kit — Docker Compose para Dokploy & GitHub CI/CD
#
# Este compose construye UN template como tienda de demostración/producción.
# Por defecto usa templates/jewelry (el más completo: CMS + API + PWA).
# Selecciona otro con STORE_TEMPLATE en tu .env, por ejemplo:
#   STORE_TEMPLATE=blank   -> tu propia tienda copiada a templates/blank
# (templates/clothing es una demo frontend-only y no incluye Dockerfile.)
#
# Soporta:
# 1. Despliegue automatizado en Dokploy (PaaS) conectado a repositorio de GitHub.
# 2. Enrutamiento Traefik con certificados SSL/TLS automáticos (Let's Encrypt).
# 3. Inyección en caliente de variables de entorno (window.__RUNTIME_CONFIG__).
# 4. Verificación de salud (Healthcheck) y fallback de resiliencia local.
# ─────────────────────────────────────────────────────────────────────────────

services:
  store:
    build:
      context: ./templates/${STORE_TEMPLATE:-jewelry}
      dockerfile: docker/Dockerfile
    image: whatsapp-sales-kit-store:latest
    container_name: ${COMPOSE_PROJECT_NAME:-store}-store
    restart: unless-stopped
    ports:
      # Puerto expuesto en VPS / Local (Dokploy enruta automáticamente vía Traefik)
      - "${STORE_PORT:-3000}:80"
    environment:
      STORE_NAME: ${STORE_NAME:-My Store}
      STORE_CURRENCY: ${STORE_CURRENCY:-USD}
      STORE_WHATSAPP_PHONE: ${STORE_WHATSAPP_PHONE:-573001234567}
      STORE_PRIMARY_COLOR: ${STORE_PRIMARY_COLOR:-#111111}
      STORE_ACCENT_COLOR: ${STORE_ACCENT_COLOR:-#4F46E5}
      STORE_ADMIN_PIN: ${STORE_ADMIN_PIN:-1879}
      STORE_LOGO_URL: ${STORE_LOGO_URL:-}
      STORE_TAGLINE: ${STORE_TAGLINE:-Powered by WhatsApp Sales Kit}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Persistencia de catálogo offline / JSON / SQLite
      - store_data:/app/data
    networks:
      - store-net
    labels:
      # ─── Dokploy & Traefik Reverse Proxy Configuration ───
      - "traefik.enable=true"
      - "traefik.http.routers.store.rule=Host(`${DOMAIN:-store.local}`)"
      - "traefik.http.routers.store.entrypoints=websecure"
      - "traefik.http.routers.store.tls.certresolver=letsencrypt"
      - "traefik.http.services.store.loadbalancer.server.port=80"

networks:
  store-net:
    driver: bridge

volumes:
  store_data:
    driver: local
