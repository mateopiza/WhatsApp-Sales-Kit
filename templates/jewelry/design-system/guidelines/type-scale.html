<!-- @dsCard group="Type" viewport="700x260" name="Type Scale" subtitle="Display and body sizes side by side" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box;margin:0}body{display:flex;flex-direction:column;gap:6px;padding:20px;background:var(--bg-page)}</style></head><body><div class="font-display" style="font-size:var(--text-display-lg);color:var(--color-ink)">Display LG</div>
   <div class="font-display" style="font-size:var(--text-display-md);color:var(--color-ink)">Display MD</div>
   <div class="font-body" style="font-size:var(--text-body-lg);color:var(--color-ink)">Body LG — 18px</div>
   <div class="font-body" style="font-size:var(--text-body);color:var(--color-ink)">Body — 16px</div>
   <div class="font-body" style="font-size:var(--text-caption);color:var(--color-taupe);letter-spacing:0.08em;text-transform:uppercase">Caption — 12px</div></body></html>
